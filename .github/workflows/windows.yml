name: Windows app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean "Larp Studio.spec"
      - name: Verify packaged CLI starts
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'larp-cli.json'
          $process = Start-Process -FilePath '.\dist\Larp Studio\Larp Studio.exe' -ArgumentList "--device-cli `"$result`" --help" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged CLI failed: $($process.ExitCode)" }
          if (-not (Test-Path $result)) { throw 'Packaged CLI produced no result' }
          $reply = Get-Content -Raw $result | ConvertFrom-Json
          if ($reply.code -ne 0 -or $reply.stdout -notmatch 'Usage:') { throw 'Packaged CLI failed to load its dependencies' }
      - name: Include source and license information
        shell: pwsh
        run: |
          git archive --format=zip --output="dist/Larp Studio/Quellcode.zip" HEAD
          Copy-Item LICENSE,THIRD-PARTY.md,README.md,README.de.md,START-HIER.txt,FINAL-START.txt,WLAN-ANLEITUNG.txt 'dist/Larp Studio/'
      - uses: actions/upload-artifact@v4
        with:
          name: Larp-Studio-Windows
          path: dist/Larp Studio/
          retention-days: 30
          if-no-files-found: error
