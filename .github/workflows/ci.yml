name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests without iPhone
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check ui/app.js
          node --check ui/studio.js
          node --check ui/library.js
      - name: Compile Python source
        run: python -m compileall -q app.py bootstrap.py engine.py transport.py driving.py artwork.py route_library.py storage.py
